<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorokoo</title>
  <meta name="description" content="Shorokoo. This website is being built.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #14213d;
      --paper: #e9eef2;
      --muted: #4d5b73;
    }
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 36rem; }
    .mark { display: block; width: 5.5rem; height: auto; margin-bottom: 2rem; }
    h1 {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    p {
      margin-top: 1.25rem;
      font-size: 1.125rem;
      line-height: 1.6;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 88 56" role="img" aria-label="Shorokoo logo">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#2f6f73" stroke-width="8"/>
      <circle cx="60" cy="28" r="22" fill="none" stroke="#c9a227" stroke-width="8"/>
    </svg>
    <h1>Shorokoo</h1>
    <p>This website is being built. Check back soon.</p>
  </main>
</body>
</html>
